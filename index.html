<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f0da">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>오늘의 말씀</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    font-weight:300;
    overflow:hidden;
    background:#f7f0da;
    color:#4a463c;
    transition:color .8s ease;
  }
  body.light-text { color:#fdfcf8; }

  /* ── 배경 씬 ─────────────────────────── */
  .scene {
    position:fixed; inset:0; opacity:0;
    transition:opacity 1.4s ease;
    pointer-events:none;
  }
  .scene.on { opacity:1; }
  .scene svg { position:absolute; bottom:0; left:0; width:100%; height:52%; display:block; }

  #sc-mist   { background:linear-gradient(180deg,#faf3dc 0%,#f6ecd0 34%,#eadcc0 60%,#d8c5ab 100%); }
  #sc-sea    { background:linear-gradient(180deg,#fdf4e2 0%,#f8d9c3 16%,#f1a8b2 32%,#e78d9d 42%,#eeb59b 48%,#d9b5a9 58%,#a3c2d9 78%,#78a7c8 100%); }
  #sc-dusk   { background:linear-gradient(180deg,#535d84 0%,#7c688f 26%,#b57a85 46%,#e5927f 62%,#f2a985 78%,#f7c9a0 100%); }
  #sc-night  { background:linear-gradient(180deg,#0a0f24 0%,#141c3a 48%,#26355c 82%,#3c4f78 100%); }
  #sc-dawn   { background:linear-gradient(180deg,#e7e1f3 0%,#efd9dd 38%,#f7ddd2 64%,#faeddc 100%); }
  #sc-gold   { background:linear-gradient(180deg,#fcecc9 0%,#f5d49a 34%,#e5ab6e 66%,#c07d4b 100%); }

  /* ── 공통 레이아웃 ────────────────────── */
  #app {
    position:relative; height:100dvh; max-width:520px; margin:0 auto;
    display:flex; flex-direction:column;
  }
  .screen {
    position:absolute; inset:0; display:none; flex-direction:column;
    padding:max(24px, env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  .screen.on { display:flex; animation:fadein .7s ease; }
  @keyframes fadein { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  .grow { flex:1; }
  .center-col { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }

  /* 상단 진행 바 */
  .topbar { display:flex; align-items:center; gap:18px; margin-bottom:34px; }
  .back-btn {
    background:none; border:none; cursor:pointer; padding:6px;
    color:inherit; opacity:.65; font-size:22px; line-height:1;
  }
  .progress { flex:1; height:4px; border-radius:99px; background:rgba(90,84,70,.18); overflow:hidden; }
  .progress > i { display:block; height:100%; width:0; border-radius:99px; background:#7a7362; transition:width .5s ease; }

  /* 질문 화면 */
  .q-title {
    font-size:clamp(22px, 6vw, 27px); font-weight:400; line-height:1.45;
    text-align:center; margin-bottom:30px; color:#55503f;
  }
  .opts { display:flex; flex-direction:column; gap:14px; }
  .opt {
    background:rgba(255,255,255,.94); border:none; border-radius:15px;
    padding:21px 24px; font-size:17.5px; font-weight:300; color:#4a463c;
    text-align:left; cursor:pointer; font-family:inherit;
    box-shadow:0 3px 14px rgba(96,80,50,.09);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .opt:active { transform:scale(.975); }
  .opt small { display:block; margin-top:4px; font-size:13.5px; opacity:.6; letter-spacing:.02em; }

  /* 필 버튼 */
  .pill {
    display:block; width:100%; padding:19px 20px;
    background:none; border:1.5px solid currentColor; border-radius:999px;
    color:inherit; font-family:inherit; font-size:14.5px; font-weight:400;
    letter-spacing:.32em; text-indent:.32em; cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .pill:active { transform:scale(.98); }
  .pill.solid { background:rgba(60,55,42,.85); border-color:transparent; color:#fdfcf5; }
  body.light-text .pill.solid { background:rgba(255,255,255,.92); color:#3d3a30; }

  /* 인트로 */
  .brand-label { font-size:12.5px; letter-spacing:.5em; text-indent:.5em; opacity:.55; margin-bottom:18px; }
  .brand-title { font-size:clamp(40px,11vw,52px); font-weight:200; letter-spacing:.04em; color:#4d4837; }
  .brand-sub { margin-top:20px; font-size:16px; line-height:1.8; opacity:.7; }

  /* 목표 화면 */
  .goal-icon { width:104px; height:104px; margin:0 auto 34px; display:block; }
  .goal-title { font-size:clamp(26px,7vw,32px); font-weight:300; text-align:center; margin-bottom:38px; color:#55503f; }
  .goal-card {
    display:flex; align-items:center; gap:18px;
    background:rgba(255,255,255,.55); border-radius:17px;
    padding:20px 22px; margin-bottom:16px;
    font-size:16.5px; line-height:1.6; color:#524d3f;
  }
  .goal-check {
    flex:none; width:44px; height:44px; border-radius:50%;
    background:#a9a291; color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }

  /* 인물 결과 카드 */
  .char-card {
    background:rgba(255,255,255,.88); border-radius:22px;
    padding:44px 34px; text-align:center;
    box-shadow:0 10px 40px rgba(80,64,40,.13);
  }
  .char-pre { font-size:19px; opacity:.75; margin-bottom:14px; }
  .char-name { font-size:clamp(38px,10vw,46px); font-weight:300; color:#3d3a30; margin-bottom:12px; }
  .char-trait { font-size:18.5px; opacity:.72; margin-bottom:26px; }
  .char-desc { font-size:16.5px; line-height:1.75; opacity:.85; }

  /* 말씀 화면 */
  .verse-wrap { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; padding:10px 4px; }
  .verse-text {
    font-size:clamp(21px, 5.9vw, 26px); font-weight:300; line-height:1.72;
    text-shadow:0 1px 14px rgba(0,0,0,.06);
    white-space:pre-line; word-break:keep-all;
  }
  body.light-text .verse-text { text-shadow:0 2px 18px rgba(0,0,0,.28); }
  .verse-ref {
    margin-top:34px; font-size:13.5px; letter-spacing:.42em; text-indent:.42em;
    opacity:.72; font-weight:400;
  }
  .cta-card {
    background:rgba(255,255,255,.82); color:#4a463c;
    border-radius:17px; padding:20px 22px; margin-bottom:22px;
    backdrop-filter:blur(6px);
    box-shadow:0 6px 24px rgba(40,32,18,.12);
    text-align:left;
  }
  body.light-text .cta-card { background:rgba(255,255,255,.9); }
  .cta-label { font-size:12px; letter-spacing:.34em; opacity:.6; margin-bottom:10px; font-weight:500; }
  .cta-text { font-size:16px; line-height:1.7; word-break:keep-all; }

  /* 메인 상단/하단 */
  .main-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .main-date { font-size:13px; letter-spacing:.28em; text-indent:.28em; opacity:.66; }
  .main-streak { margin-top:9px; font-size:13.5px; opacity:.6; }
  .icon-btn {
    background:none; border:none; cursor:pointer; color:inherit;
    padding:8px; opacity:.8; display:inline-flex;
  }
  .icon-btn svg { width:26px; height:26px; }
  .main-actions { display:flex; gap:4px; }
  .cat-chip {
    margin-top:14px; display:inline-flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.32); border:1px solid rgba(120,110,90,.25);
    border-radius:999px; padding:9px 18px; cursor:pointer;
    color:inherit; font-family:inherit; font-size:13.5px; font-weight:400;
    letter-spacing:.06em; backdrop-filter:blur(4px);
    transition:background .2s ease;
  }
  body.light-text .cat-chip { background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.4); }
  .cat-chip i { font-style:normal; opacity:.6; font-size:11px; }
  .main-bottom { display:flex; flex-direction:column; gap:16px; }
  .saved-link {
    background:none; border:none; color:inherit; font-family:inherit; cursor:pointer;
    font-size:13.5px; letter-spacing:.22em; text-indent:.22em; opacity:.62; padding:6px;
  }

  /* 지금 상황 선택 패널 */
  #catPanel {
    position:fixed; inset:0; z-index:40; display:none; flex-direction:column;
    background:#f6efd9; color:#4a463c;
    max-width:520px; margin:0 auto; overflow-y:auto;
    padding:max(24px, env(safe-area-inset-top)) 28px 28px;
  }
  #catPanel.on { display:flex; animation:fadein .4s ease; }

  /* 저장 목록 패널 */
  #savedPanel {
    position:fixed; inset:0; z-index:40; display:none; flex-direction:column;
    background:#f6efd9; color:#4a463c;
    max-width:520px; margin:0 auto;
    padding:max(24px, env(safe-area-inset-top)) 28px 28px;
    overflow-y:auto;
  }
  #savedPanel.on { display:flex; animation:fadein .4s ease; }
  .sp-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; }
  .sp-title { font-size:20px; font-weight:400; letter-spacing:.1em; }
  .sp-list { flex:1; display:flex; flex-direction:column; gap:14px; }
  .sp-item {
    background:rgba(255,255,255,.9); border-radius:15px; padding:20px 22px;
    box-shadow:0 3px 12px rgba(96,80,50,.08);
  }
  .sp-item p { font-size:15.5px; line-height:1.7; word-break:keep-all; }
  .sp-item .ref { margin-top:10px; font-size:12px; letter-spacing:.3em; opacity:.6; }
  .sp-empty { text-align:center; opacity:.55; margin:60px 0; line-height:1.8; }
  .sp-settings { margin-top:30px; border-top:1px solid rgba(90,84,70,.15); padding-top:22px; display:flex; flex-direction:column; gap:10px; }
  .sp-set-label { font-size:12px; letter-spacing:.3em; opacity:.5; margin-bottom:6px; }
  .sp-btn {
    background:rgba(255,255,255,.85); border:none; border-radius:12px;
    padding:15px 18px; font-size:15px; color:#4a463c; font-family:inherit;
    text-align:left; cursor:pointer; box-shadow:0 2px 8px rgba(96,80,50,.06);
  }
  .sp-reset {
    margin-top:10px; background:none; border:none; color:inherit; font-family:inherit;
    cursor:pointer; font-size:12.5px; opacity:.45; letter-spacing:.15em; padding:8px;
  }
  .sp-foot { text-align:center; margin-top:12px; font-size:12px; opacity:.4; }
  .sp-foot a { color:inherit; }

  /* 토스트 */
  #toast {
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px);
    background:rgba(45,41,32,.92); color:#faf7ee;
    padding:13px 26px; border-radius:999px; font-size:14.5px; letter-spacing:.06em;
    opacity:0; pointer-events:none; transition:all .35s ease; z-index:60; white-space:nowrap;
  }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ── 배경 씬들 ── -->
<div class="scene on" id="sc-mist">
  <svg viewBox="0 0 500 260" preserveAspectRatio="none">
    <path d="M0,150 L90,96 L150,140 L230,80 L310,150 L390,105 L460,150 L500,125 L500,260 L0,260 Z" fill="rgba(146,128,110,.30)"/>
    <path d="M0,190 L70,150 L160,196 L260,132 L350,196 L430,158 L500,190 L500,260 L0,260 Z" fill="rgba(118,98,84,.42)"/>
    <path d="M0,230 L110,186 L210,236 L330,178 L430,232 L500,205 L500,260 L0,260 Z" fill="rgba(84,66,56,.58)"/>
  </svg>
</div>
<div class="scene" id="sc-sea">
  <svg viewBox="0 0 500 260" preserveAspectRatio="none">
    <rect x="0" y="30" width="500" height="4" fill="rgba(255,255,255,.25)"/>
    <rect x="60" y="70" width="380" height="3" fill="rgba(255,255,255,.18)"/>
    <rect x="120" y="110" width="260" height="3" fill="rgba(255,255,255,.14)"/>
    <rect x="40" y="160" width="420" height="3" fill="rgba(255,255,255,.10)"/>
  </svg>
</div>
<div class="scene" id="sc-dusk">
  <svg viewBox="0 0 500 260" preserveAspectRatio="none">
    <path d="M0,140 L80,70 L170,135 L260,55 L350,130 L440,85 L500,120 L500,260 L0,260 Z" fill="rgba(40,36,66,.55)"/>
    <path d="M0,200 L100,140 L200,205 L300,130 L400,200 L500,160 L500,260 L0,260 Z" fill="rgba(26,23,48,.85)"/>
  </svg>
</div>
<div class="scene" id="sc-night">
  <svg viewBox="0 0 500 500" preserveAspectRatio="xMidYMax slice" style="height:100%;">
    <g fill="#ffffff">
      <circle cx="40" cy="60" r="1.5" opacity=".9"/><circle cx="120" cy="30" r="1" opacity=".7"/>
      <circle cx="200" cy="90" r="1.3" opacity=".8"/><circle cx="280" cy="40" r="1" opacity=".6"/>
      <circle cx="350" cy="110" r="1.6" opacity=".9"/><circle cx="430" cy="70" r="1" opacity=".7"/>
      <circle cx="470" cy="150" r="1.2" opacity=".8"/><circle cx="80" cy="160" r="1" opacity=".6"/>
      <circle cx="160" cy="200" r="1.4" opacity=".8"/><circle cx="240" cy="150" r="1" opacity=".5"/>
      <circle cx="320" cy="220" r="1.2" opacity=".7"/><circle cx="400" cy="190" r="1" opacity=".6"/>
      <circle cx="60" cy="260" r="1.3" opacity=".7"/><circle cx="140" cy="300" r="1" opacity=".5"/>
      <circle cx="300" cy="300" r="1.5" opacity=".8"/><circle cx="440" cy="280" r="1" opacity=".6"/>
    </g>
    <path d="M0,430 L110,370 L220,435 L340,360 L450,430 L500,405 L500,500 L0,500 Z" fill="rgba(6,9,20,.9)"/>
  </svg>
</div>
<div class="scene" id="sc-dawn">
  <svg viewBox="0 0 500 260" preserveAspectRatio="none">
    <path d="M0,170 Q125,110 250,165 T500,155 L500,260 L0,260 Z" fill="rgba(173,150,168,.35)"/>
    <path d="M0,215 Q140,160 280,212 T500,205 L500,260 L0,260 Z" fill="rgba(140,116,138,.5)"/>
  </svg>
</div>
<div class="scene" id="sc-gold">
  <svg viewBox="0 0 500 260" preserveAspectRatio="none">
    <path d="M0,180 Q100,140 200,178 T400,172 T500,180 L500,260 L0,260 Z" fill="rgba(146,90,46,.45)"/>
    <path d="M0,225 Q120,190 250,222 T500,218 L500,260 L0,260 Z" fill="rgba(104,60,28,.6)"/>
  </svg>
</div>

<div id="app">

  <!-- 인트로 -->
  <section class="screen on" id="s-intro">
    <div class="grow center-col">
      <div class="brand-label">DAILY VERSE</div>
      <h1 class="brand-title">오늘의 말씀</h1>
      <p class="brand-sub">하루를 여는 한 구절,<br>마음에 새기는 말씀</p>
    </div>
    <button class="pill" onclick="go('s-q1')">시작하기</button>
  </section>

  <!-- 질문 1 -->
  <section class="screen" id="s-q1">
    <div class="topbar">
      <button class="back-btn" onclick="go('s-intro')">‹</button>
      <div class="progress"><i style="width:20%"></i></div>
    </div>
    <h2 class="q-title">요즘 마음 깊은 곳에서<br>무엇과 가장 씨름하고 있나요?</h2>
    <div class="opts">
      <button class="opt" onclick="pickCat('guilt')">죄책감이나 수치심</button>
      <button class="opt" onclick="pickCat('anxiety')">불안과 걱정</button>
      <button class="opt" onclick="pickCat('lonely')">외로움과 공허함</button>
      <button class="opt" onclick="pickCat('lust')">정욕과 원치 않는 생각</button>
      <button class="opt" onclick="pickCat('distant')">하나님과 멀어진 느낌</button>
      <button class="opt" onclick="pickCat('doubt')">의심과 실망</button>
      <button class="opt" onclick="pickCat('unsure')">잘 모르겠어요</button>
    </div>
  </section>

  <!-- 질문 2 -->
  <section class="screen" id="s-q2">
    <div class="topbar">
      <button class="back-btn" onclick="go('s-q1')">‹</button>
      <div class="progress"><i style="width:40%"></i></div>
    </div>
    <h2 class="q-title">언제 말씀과 함께하고 싶으세요?</h2>
    <div class="opts">
      <button class="opt" onclick="pickTime('아침')">아침 <small>하루를 시작할 때</small></button>
      <button class="opt" onclick="pickTime('점심')">점심 <small>잠시 쉬어갈 때</small></button>
      <button class="opt" onclick="pickTime('저녁')">저녁 <small>하루를 돌아볼 때</small></button>
      <button class="opt" onclick="pickTime('잠들기 전')">잠들기 전 <small>마음을 정리할 때</small></button>
    </div>
  </section>

  <!-- 목표 확인 -->
  <section class="screen" id="s-goals">
    <div class="topbar">
      <button class="back-btn" onclick="go('s-q2')">‹</button>
      <div class="progress"><i style="width:60%"></i></div>
    </div>
    <div class="grow" style="display:flex; flex-direction:column; justify-content:center;">
      <svg class="goal-icon" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="rgba(255,255,255,.85)"/>
        <circle cx="50" cy="50" r="30" fill="#c9c2ae"/>
        <circle cx="50" cy="50" r="18" fill="#f4efdf"/>
        <circle cx="50" cy="50" r="7" fill="#8b8371"/>
        <line x1="50" y1="50" x2="76" y2="24" stroke="#6b6455" stroke-width="4" stroke-linecap="round"/>
        <path d="M76,24 L86,20 L82,30 Z" fill="#6b6455"/>
      </svg>
      <h2 class="goal-title">알겠어요!<br>이렇게 도와드릴게요:</h2>
      <div class="goal-card"><span class="goal-check">✓</span><span id="goal1"></span></div>
      <div class="goal-card"><span class="goal-check">✓</span><span id="goal2"></span></div>
    </div>
    <button class="pill" onclick="go('s-chars')">계속하기</button>
  </section>

  <!-- 인물 선택 -->
  <section class="screen" id="s-chars">
    <div class="topbar">
      <button class="back-btn" onclick="go('s-goals')">‹</button>
      <div class="progress"><i style="width:80%"></i></div>
    </div>
    <h2 class="q-title">어떤 믿음의 인물이<br>마음에 와닿나요?</h2>
    <div class="opts">
      <button class="opt" onclick="pickChar('esther')">에스더 <small>용기 있고 결단력 있는</small></button>
      <button class="opt" onclick="pickChar('david')">다윗 <small>마음을 다해 예배하는</small></button>
      <button class="opt" onclick="pickChar('daniel')">다니엘 <small>흔들리지 않고 신실한</small></button>
      <button class="opt" onclick="pickChar('ruth')">룻 <small>끝까지 곁을 지키는</small></button>
      <button class="opt" onclick="pickChar('peter')">베드로 <small>넘어져도 다시 일어서는</small></button>
      <button class="opt" onclick="pickChar('mary')">마리아 <small>믿음으로 순종하는</small></button>
    </div>
  </section>

  <!-- 인물 결과 -->
  <section class="screen" id="s-charResult">
    <div class="grow center-col">
      <div class="char-card">
        <p class="char-pre">탁월한 선택이에요.</p>
        <h2 class="char-name" id="charName"></h2>
        <p class="char-trait" id="charTrait"></p>
        <p class="char-desc">첫 번째 말씀은 <b id="charName2"></b>의<br>삶에서 영감을 받아 준비했어요.</p>
      </div>
    </div>
    <button class="pill" onclick="showFirstVerse()">내 말씀 보기</button>
  </section>

  <!-- 첫 말씀 -->
  <section class="screen" id="s-firstVerse">
    <div class="verse-wrap">
      <p class="verse-text" id="fvText"></p>
      <p class="verse-ref" id="fvRef"></p>
    </div>
    <div class="cta-card">
      <div class="cta-label">🙌 실천 카드</div>
      <div class="cta-text" id="fvCta"></div>
    </div>
    <button class="pill" onclick="enterMain()">계속하기</button>
  </section>

  <!-- 메인 -->
  <section class="screen" id="s-main">
    <div class="main-top">
      <div>
        <div class="main-date" id="mDate"></div>
        <div class="main-streak" id="mStreak"></div>
        <button class="cat-chip" onclick="openCatPanel()">지금 마음 · <span id="catLabel"></span> <i>▾</i></button>
      </div>
      <div class="main-actions">

// ─── 배경 씬 ───────────────────────────
const SCENES = [
  { id:'sc-sea',   light:true  },
  { id:'sc-dusk',  light:true  },
  { id:'sc-mist',  light:false },
  { id:'sc-dawn',  light:false },
  { id:'sc-gold',  light:true  },
  { id:'sc-night', light:true  },
];
function setScene(i) {
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('on'));
  const sc = SCENES[i % SCENES.length];
  document.getElementById(sc.id).classList.add('on');
  document.body.classList.toggle('light-text', sc.light);
}
function setMistScene() {
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('on'));
  document.getElementById('sc-mist').classList.add('on');
  document.body.classList.remove('light-text');
}

// ─── 상태 ───────────────────────────
const store = {
  get() { try { return JSON.parse(localStorage.getItem('dv_state')) || {}; } catch(e) { return {}; } },
  set(s) { localStorage.setItem('dv_state', JSON.stringify(s)); }
};
let state = store.get();
let currentVerse = null;
let sceneIdx = 0;

function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

// ─── 온보딩 ───────────────────────────
function pickCat(cat) { state.cat = cat; store.set(state); go('s-q2'); }
function pickTime(time) {
  state.time = time; store.set(state);
  document.getElementById('goal1').textContent = GOALS[state.cat] || GOALS.unsure;
  document.getElementById('goal2').textContent = `${state.time}마다 나를 위한 한 구절과 실천 카드를 만나도록.`;
  go('s-goals');
}
function pickChar(key) {
  state.char = key; store.set(state);
  const ch = CHARS[key];
  document.getElementById('charName').textContent = ch.name;
  document.getElementById('charName2').textContent = ch.name;
  document.getElementById('charTrait').textContent = ch.trait;
  go('s-charResult');
}
function showFirstVerse() {
  const v = CHARS[state.char].v;
  document.getElementById('fvText').textContent = v.t;
  document.getElementById('fvRef').textContent = v.r;
  document.getElementById('fvCta').textContent = v.c;
  setScene(0); sceneIdx = 0;
  go('s-firstVerse');
}
function enterMain() {
  state.done = true; store.set(state);
  initMain();
}

// ─── 메인 ───────────────────────────
const CAT_LABELS = {
  guilt:'죄책감이나 수치심', anxiety:'불안과 걱정', lonely:'외로움과 공허함',
  lust:'정욕과 원치 않는 생각', distant:'하나님과 멀어진 느낌',
  doubt:'의심과 실망', unsure:'잘 모르겠어요',
};
function pool() {
  const cat = state.cat || 'unsure';
  const p = VERSES.filter(v => v.cat === cat);
  return p.length ? p : VERSES;
}
function daysSinceEpoch() { return Math.floor(Date.now() / 86400000); }
function updateCatLabel() {
  document.getElementById('catLabel').textContent = CAT_LABELS[state.cat] || CAT_LABELS.unsure;
}
function openCatPanel() { document.getElementById('catPanel').classList.add('on'); }
function closeCatPanel() { document.getElementById('catPanel').classList.remove('on'); }
function changeCat(cat) {
  state.cat = cat; store.set(state);
  updateCatLabel();
  closeCatPanel();
  const p = pool();
  sceneIdx = (sceneIdx + 1) % SCENES.length;
  setScene(sceneIdx);
  renderVerse(p[Math.floor(Math.random() * p.length)]);
  toast(`'${CAT_LABELS[cat]}'에 맞는 말씀을 준비했어요`);
}

function renderVerse(v) {
  currentVerse = v;
  document.getElementById('mText').textContent = v.t;
  document.getElementById('mRef').textContent = v.r;
  document.getElementById('mCta').textContent = v.c;
  updateHeart();
}
function nextVerse() {
  const p = pool();
  let v;
  do { v = p[Math.floor(Math.random() * p.length)]; } while (p.length > 1 && v === currentVerse);
  sceneIdx = (sceneIdx + 1) % SCENES.length;
  setScene(sceneIdx);
  renderVerse(v);
}

function updateStreak() {
  const today = daysSinceEpoch();
  if (state.lastDay === today) { /* 이미 방문 */ }
  else if (state.lastDay === today - 1) { state.streak = (state.streak || 0) + 1; }
  else { state.streak = 1; }
  state.lastDay = today; store.set(state);
  const el = document.getElementById('mStreak');
  el.textContent = state.streak > 1 ? `🔥 ${state.streak}일째 말씀과 함께하고 있어요` : '오늘도 말씀과 함께해요';
}

function initMain() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('mDate').textContent =
    `${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
  updateStreak();
  updateCatLabel();
  updateBell();
  const p = pool();
  sceneIdx = daysSinceEpoch() % SCENES.length;
  setScene(sceneIdx);
  renderVerse(p[daysSinceEpoch() % p.length]);
  updateSavedCount();
  go('s-main');
  scheduleNotif();
}

// ─── 저장 ───────────────────────────
function savedList() { return state.saved || []; }
function isSaved(v) { return savedList().some(s => s.r === v.r); }
function toggleSave() {
  if (!currentVerse) return;
  let s = savedList();
  if (isSaved(currentVerse)) {
    s = s.filter(x => x.r !== currentVerse.r);
    toast('저장을 해제했어요');
  } else {
    s.push({ t: currentVerse.t, r: currentVerse.r });
    toast('말씀을 저장했어요 ♥');
  }
  state.saved = s; store.set(state);
  updateHeart(); updateSavedCount();
}
function updateHeart() {
  const on = currentVerse && isSaved(currentVerse);
  document.getElementById('heartIcon').setAttribute('fill', on ? 'currentColor' : 'none');
}
function updateSavedCount() {
  const n = savedList().length;
  document.getElementById('savedCount').textContent = n ? `(${n})` : '';
}
function openSaved() {
  const list = document.getElementById('spList');
  const s = savedList();
  list.innerHTML = s.length
    ? s.map(v => `<div class="sp-item"><p>${v.t}</p><div class="ref">${v.r}</div></div>`).reverse().join('')
    : '<div class="sp-empty">아직 저장한 말씀이 없어요.<br>마음에 닿는 구절에서 ♡를 눌러 보세요.</div>';
  document.getElementById('savedPanel').classList.add('on');
}
function closeSaved() { document.getElementById('savedPanel').classList.remove('on'); }
function resetAll() {
  if (!confirm('온보딩부터 다시 시작할까요? 저장한 말씀도 함께 지워져요.')) return;
  localStorage.removeItem('dv_state');
  location.reload();
}

// ─── 백업 / 복원 ───────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '오늘의말씀-백업.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('백업 파일을 내려받았어요');
}
function importData(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (typeof data !== 'object' || data === null) throw new Error();
      state = data; store.set(state);
      toast('복원했어요. 앱을 다시 시작합니다');
      setTimeout(() => location.reload(), 900);
    } catch(e) { toast('백업 파일이 올바르지 않아요'); }
  };
  reader.readAsText(file);
  input.value = '';
}

// ─── 알림 ───────────────────────────
const TIME_MAP = { '아침':[8,0], '점심':[12,30], '저녁':[20,0], '잠들기 전':[22,30] };
function notifTime() { return TIME_MAP[state.time] || TIME_MAP['아침']; }
function updateBell() {
  const on = !!state.notif && typeof Notification !== 'undefined' && Notification.permission === 'granted';
  document.getElementById('bellIcon').setAttribute('fill', on ? 'currentColor' : 'none');
}
async function toggleNotif() {
  if (typeof Notification === 'undefined') { toast('이 브라우저는 알림을 지원하지 않아요'); return; }
  if (state.notif) {
    state.notif = false; store.set(state); updateBell();
    toast('알림을 껐어요'); return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('알림 권한이 허용되지 않았어요'); return; }
  state.notif = true; store.set(state); updateBell();
  scheduleNotif();
  const [h,m] = notifTime();
  toast(`매일 ${state.time || '아침'} ${h}:${String(m).padStart(2,'0')} 알림을 켰어요`);
}
// 지원 브라우저(안드로이드 크롬 일부)에서는 앱이 꺼져 있어도 예약 알림 시도
async function scheduleNotif() {
  if (!state.notif || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  try {
    if (!('serviceWorker' in navigator)) return;
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg || !('showTrigger' in Notification.prototype) || typeof TimestampTrigger === 'undefined') return;
    const [h,m] = notifTime();
    const when = new Date(); when.setHours(h,m,0,0);
    if (when <= new Date()) when.setDate(when.getDate() + 1);
    const p = pool();
    const v = p[(daysSinceEpoch()+1) % p.length];
    const old = await reg.getNotifications({ tag:'daily-verse', includeTriggered:false }).catch(()=>[]);
    old.forEach(n => n.close());
    await reg.showNotification('오늘의 말씀', {
      body:`${v.t}\n— ${v.r}`, tag:'daily-verse', icon:'icon-192.png',
      showTrigger: new TimestampTrigger(when.getTime()),
    });
  } catch(e) { /* 미지원 환경 */ }
}
// 앱이 열려 있는 동안 시간이 되면 알림
setInterval(() => {
  if (!state.notif || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const [h,m] = notifTime();
  const n = new Date();
  if (n.getHours() === h && n.getMinutes() === m && state.lastNotifDay !== daysSinceEpoch()) {
    state.lastNotifDay = daysSinceEpoch(); store.set(state);
    const p = pool();
    const v = p[daysSinceEpoch() % p.length];
    try { new Notification('오늘의 말씀', { body:`${v.t}\n— ${v.r}`, icon:'icon-192.png' }); } catch(e) {}
  }
}, 30000);

// ─── 말씀 이미지 저장 ───────────────────────────
const IMG_SCENES = {
  'sc-sea':   { stops:[[0,'#fdf4e2'],[.16,'#f8d9c3'],[.32,'#f1a8b2'],[.42,'#e78d9d'],[.48,'#eeb59b'],[.58,'#d9b5a9'],[.78,'#a3c2d9'],[1,'#78a7c8']], deco:'sea', light:true },
  'sc-dusk':  { stops:[[0,'#535d84'],[.26,'#7c688f'],[.46,'#b57a85'],[.62,'#e5927f'],[.78,'#f2a985'],[1,'#f7c9a0']], m1:'rgba(40,36,66,.55)', m2:'rgba(26,23,48,.85)', light:true },
  'sc-mist':  { stops:[[0,'#faf3dc'],[.34,'#f6ecd0'],[.6,'#eadcc0'],[1,'#d8c5ab']], m1:'rgba(118,98,84,.42)', m2:'rgba(84,66,56,.58)', light:false },
  'sc-night': { stops:[[0,'#0a0f24'],[.48,'#141c3a'],[.82,'#26355c'],[1,'#3c4f78']], deco:'stars', m2:'rgba(6,9,20,.9)', light:true },
  'sc-dawn':  { stops:[[0,'#e7e1f3'],[.38,'#efd9dd'],[.64,'#f7ddd2'],[1,'#faeddc']], m1:'rgba(173,150,168,.35)', m2:'rgba(140,116,138,.5)', light:false },
  'sc-gold':  { stops:[[0,'#fcecc9'],[.34,'#f5d49a'],[.66,'#e5ab6e'],[1,'#c07d4b']], m1:'rgba(146,90,46,.45)', m2:'rgba(104,60,28,.6)', light:true },
};
const IMG_FONT = "Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif";

function imgMountains(ctx, W, H, color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  pts.forEach(([x, y]) => ctx.lineTo(x * W, y * H));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}
function imgWrap(ctx, text, maxW) {
  const lines = [];
  let line = '';
  for (const w of text.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines.flatMap(l => {
    if (ctx.measureText(l).width <= maxW) return [l];
    const out = []; let cur = '';
    for (const ch of l) {
      if (ctx.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  });
}
function renderVerseImage(v) {
  return new Promise(resolve => {
    const W = 1080, H = 1920;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const sc = IMG_SCENES[SCENES[sceneIdx % SCENES.length].id];
    // 배경 그라데이션
    const g = ctx.createLinearGradient(0, 0, 0, H);
    sc.stops.forEach(([t, c]) => g.addColorStop(t, c));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 장식 (본문을 가리지 않도록 물결은 아래쪽, 별은 위쪽에만)
    if (sc.deco === 'sea') {
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      [[90,1440,900,7],[220,1560,640,6],[60,1680,760,6],[300,1790,520,5]].forEach(r => ctx.fillRect(...r));
    }
    if (sc.deco === 'stars') {
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 42; i++) {
        const x = (i * 197) % W, y = ((i * 283) % 430) + 50, r = (i % 3) * .9 + 1.4;
        ctx.globalAlpha = .35 + (i % 5) * .13;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (sc.m1) imgMountains(ctx, W, H, sc.m1, [[0,.72],[.26,.60],[.5,.74],[.76,.62],[1,.72]]);
    if (sc.m2) imgMountains(ctx, W, H, sc.m2, [[0,.87],[.34,.72],[.66,.88],[1,.78]]);
    // 본문
    ctx.textAlign = 'center';
    ctx.fillStyle = sc.light ? '#fdfcf8' : '#4a463c';
    ctx.shadowColor = sc.light ? 'rgba(0,0,0,.3)' : 'rgba(0,0,0,.08)';
    ctx.shadowBlur = 16;
    ctx.font = `300 58px ${IMG_FONT}`;
    const lines = imgWrap(ctx, v.t, 880);
    const lh = 100;
    let y = H * .44 - (lines.length - 1) * lh / 2;
    lines.forEach(l => { ctx.fillText(l, W / 2, y); y += lh; });
    // 출처
    ctx.shadowBlur = 8;
    ctx.font = `400 34px ${IMG_FONT}`;
    try { ctx.letterSpacing = '12px'; } catch(e) {}
    ctx.globalAlpha = .8;
    ctx.fillText(v.r, W / 2, y + 40);
    // 워터마크
    ctx.globalAlpha = .5;
    ctx.font = `300 28px ${IMG_FONT}`;
    try { ctx.letterSpacing = '8px'; } catch(e) {}
    ctx.fillText('오늘의 말씀', W / 2, H - 100);
    ctx.globalAlpha = 1;
    try { ctx.letterSpacing = '0px'; } catch(e) {}
    cv.toBlob(resolve, 'image/png');
  });
}
async function saveVerseImage() {
  if (!currentVerse) return;
  toast('이미지를 만들고 있어요…');
  const blob = await renderVerseImage(currentVerse);
  if (!blob) { toast('이미지 생성에 실패했어요'); return; }
  const name = `오늘의말씀-${currentVerse.r.replace(/[:\s]/g, '_')}.png`;
  const file = new File([blob], name, { type:'image/png' });
  if (navigator.canShare && navigator.canShare({ files:[file] })) {
    try {
      await navigator.share({ files:[file], title:'오늘의 말씀' });
      return;
    } catch(e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('이미지를 저장했어요');
}

// ─── 공유 ───────────────────────────
function shareVerse() {
  if (!currentVerse) return;
  const msg = `"${currentVerse.t}"\n— ${currentVerse.r}`;
  if (navigator.share) {
    navigator.share({ title:'오늘의 말씀', text: msg }).catch(() => {});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(msg).then(() => toast('말씀을 복사했어요'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = msg; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('말씀을 복사했어요');
  }
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

// ─── PWA 설치 ───────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
async function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
}

// ─── 서비스 워커 ───────────────────────────
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ─── 시작 ───────────────────────────
if (state.done) initMain();
else setMistScene();
</script>
